<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Ashley P. Harvey — AI Enablement and Talent Strategy</title>
  <desc id="desc">Purple and orange branded banner for Ashley Harvey's GitHub profile.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A090D"/>
      <stop offset=".55" stop-color="#151020"/>
      <stop offset="1" stop-color="#0A090D"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F97316"/>
      <stop offset=".5" stop-color="#C26068"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <radialGradient id="glow1">
      <stop offset="0" stop-color="#7C3AED" stop-opacity=".42"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2">
      <stop offset="0" stop-color="#F97316" stop-opacity=".26"/>
      <stop offset="1" stop-color="#F97316" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#A78BFA" stroke-opacity=".07"/>
    </pattern>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <circle cx="1050" cy="45" r="300" fill="url(#glow1)"/>
  <circle cx="130" cy="350" r="250" fill="url(#glow2)"/>
  <path d="M0 326 C240 280 360 365 600 312 S960 270 1200 320 V360 H0Z" fill="#7C3AED" opacity=".10"/>
  <path d="M0 338 C220 300 430 360 650 329 S990 300 1200 340" fill="none" stroke="url(#accent)" stroke-width="3" opacity=".8"/>
